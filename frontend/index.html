<!doctype html>
<html lang="en" class="splash-on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Amore — Speciality Ice Cream, Coffee & Cakes</title>
    <meta name="description" content="Artisanal ice cream, specialty coffee, and bakery parlour with 3 branches in Akurana, Colombo, and Arugam Bay (Sri Lanka) — featuring iconic Durian custard, 20 flavours in edible biscuit cups, USD tourist currency, and quick ordering." />

    <!-- Icons: browser tab, iPhone home screen, Android / installed app -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Amore" />

    <!-- Link previews (WhatsApp, Facebook, X) -->
    <meta property="og:site_name" content="Amore" />
    <meta property="og:title" content="Amore — Speciality Ice Cream, Coffee & Cakes" />
    <meta property="og:description" content="20 handcrafted ice cream flavours, specialty coffee and cakes. Order online from Akurana, Colombo and Arugam Bay." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amore-icecream.web.app/" />
    <meta property="og:image" content="https://amore-icecream.web.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Amore logo beside ice cream cones" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://amore-icecream.web.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Logo splash: stays up for a minimum time (see main.tsx), then fades away -->
    <style>
      .boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FAF7F2; transition: opacity 0.6s ease, visibility 0.6s; }
      .boot-splash.is-hiding { opacity: 0; visibility: hidden; }
      .boot-splash.is-hiding img { animation: none; transform: scale(1.12); transition: transform 0.6s ease; }
      .boot-splash p { margin: 4px 0 0; font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #241A18; text-align: center; padding: 0 24px; animation: boot-rise 0.7s ease 0.45s both; }
      .boot-splash p em { color: #81001E; }
      .boot-splash small { font-family: 'Outfit', system-ui, sans-serif; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #8A7970; animation: boot-rise 0.7s ease 0.75s both; }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .boot-splash img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 10px 30px -8px rgba(129, 0, 30, 0.45); animation: boot-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both, boot-breathe 2s ease-in-out 0.6s infinite; }
      .boot-splash span { width: 42px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #81001E 0%, #F3D9A0 50%, #81001E 100%); background-size: 200% 100%; animation: boot-bar 1.2s linear infinite; }
      @keyframes boot-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes boot-breathe { 50% { transform: scale(1.05); } }
      @keyframes boot-bar { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash img, .boot-splash span, .boot-splash p, .boot-splash small { animation: none; } }
    </style>
  </head>
  <body class="bg-[#FAF7F2] text-[#241A18] antialiased selection:bg-[#8C102A] selection:text-white">
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Loading Amore">
      <img src="/favicon.svg" alt="Amore" width="96" height="96" />
      <p>Real flavours. <em>Handcrafted</em> happiness.</p>
      <small>Speciality Ice Cream · Coffee · Cakes</small>
      <span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
